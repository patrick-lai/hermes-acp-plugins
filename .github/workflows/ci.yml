name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e 'plugins/hermes-acp[test]'
      - name: Check formatting
        working-directory: plugins/hermes-acp
        run: ruff format --check .
      - name: Lint
        working-directory: plugins/hermes-acp
        run: ruff check .
      - name: Typecheck
        working-directory: plugins/hermes-acp
        run: mypy hermes_acp
      - name: Build package
        working-directory: plugins/hermes-acp
        run: python -m build --no-isolation
      - name: Run deterministic tests
        working-directory: plugins/hermes-acp
        run: pytest -q
